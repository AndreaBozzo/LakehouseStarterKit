version: "3.8"

services:
  # ============================================
  # MinIO - S3-Compatible Object Storage
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS}
    command: server --address ":9000" --console-address ":9001" /data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - lakehouse

  # ============================================
  # MinIO Init - Create Buckets on Startup
  # ============================================
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_USER} ${MINIO_PASS};
      mc mb myminio/raw --ignore-existing;
      mc mb myminio/staging --ignore-existing;
      mc mb myminio/marts --ignore-existing;
      mc anonymous set download myminio/raw;
      mc anonymous set download myminio/staging;
      mc anonymous set download myminio/marts;
      echo 'MinIO buckets created: raw, staging, marts';
      exit 0;
      "
    networks:
      - lakehouse

  # ============================================
  # PostgreSQL - Example Source Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "15432:5432"  # Mapped to 15432 on host to avoid port conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - lakehouse

  # ============================================
  # Superset - Data Visualization Platform (Optional)
  # ============================================
  # NOTE: Superset has volume permission issues on Windows
  # Use Metabase instead (see below)
  # superset:
  #   build:
  #     context: ./superset
  #     dockerfile: Dockerfile
  #   container_name: superset
  #   environment:
  #     SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
  #     SUPERSET_LOAD_EXAMPLES: 'no'
  #     AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  #     AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  #     S3_ENDPOINT: ${S3_ENDPOINT}
  #   ports:
  #     - "8088:8088"
  #   depends_on:
  #     minio:
  #       condition: service_healthy
  #     postgres:
  #       condition: service_healthy
  #   volumes:
  #     - superset_data:/app/superset_home
  #     - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
  #   command: >
  #     sh -c "superset db upgrade &&
  #            superset fab create-admin --username ${SUPERSET_USER} --firstname Admin --lastname User --email admin@example.com --password ${SUPERSET_PASS} || true &&
  #            superset init &&
  #            superset run -h 0.0.0.0 -p 8088 --with-threads --reload"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   restart: unless-stopped
  #   networks:
  #     - lakehouse

  # ============================================
  # Metabase - Data Visualization Platform
  # ============================================
  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - metabase_data:/metabase-data
      - ./lakehouse.duckdb:/duckdb/lakehouse.duckdb:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - lakehouse

  # ============================================
  # Prefect - Workflow Orchestration
  # ============================================
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/prefect
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_UI_API_URL: http://localhost:4200/api
    command: prefect server start --host 0.0.0.0
    ports:
      - "4200:4200"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - lakehouse

# ============================================
# Volumes
# ============================================
volumes:
  minio_data:
    driver: local
  postgres_data:
    driver: local
  superset_data:
    driver: local
  metabase_data:
    driver: local
  prefect_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  lakehouse:
    driver: bridge
